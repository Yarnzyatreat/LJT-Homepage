# Temporary workflow to verify the Jekyll build without GitHub Pages
name: Verify Jekyll Build

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
